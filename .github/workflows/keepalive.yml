name: Supabase Keepalive

on:
  schedule:
    - cron: '0 12 */2 * *'   # cada 2 días (más margen)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (con reintentos)
        run: |
          for i in 1 2 3 4 5; do
            echo "Intento $i..."
            HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              "${{ secrets.SUPABASE_URL }}/rest/v1/tareas?select=id&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" || echo "000")
            echo "HTTP: $HTTP"
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "206" ]; then
              echo "✅ Ping OK"
              exit 0
            fi
            echo "❌ Falló, esperando 30s..."
            sleep 30
          done
          echo "Todos los intentos fallaron"
          exit 1
